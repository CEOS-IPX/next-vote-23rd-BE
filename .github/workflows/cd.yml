# ============================================================
#  cd.yml — 빌드 & EC2 배포
# ============================================================

name: CD — 빌드 & 배포

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: voting-spring
  REGISTRY: ghcr.io

jobs:
  # =====================================================
  # 1단계: Docker 이미지 빌드 + GHCR push
  # =====================================================
  build-and-push:
    name: 빌드 & 이미지 푸시
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정 + Gradle 캐시
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      # CI에서 이미 테스트 통과 → 테스트 생략하여 시간 단축
      - name: 애플리케이션 빌드 (테스트 생략)
        run: ./gradlew build -x test --no-daemon --parallel --build-cache

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA 태그 + latest 태그 자동 생성
      - name: Docker 메타데이터 생성
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================
  # 2단계: EC2 배포 + 헬스체크
  # =====================================================
  deploy:
    name: EC2 배포
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/voting

            echo "=== [1/4] 새 이미지 pull ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull app-spring

            echo "=== [2/4] 컨테이너 재생성 ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps app-spring

            echo "=== [3/4] 헬스체크 대기 (최대 2분) ==="
            HEALTHY=false
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' voting-spring 2>/dev/null || echo "missing")
              echo "시도 $i/24 - 상태: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ 헬스체크 실패"
              echo "--- 컨테이너 로그 (마지막 100줄) ---"
              docker logs voting-spring --tail 100
              exit 1
            fi
            echo "✅ 헬스체크 통과"

            echo "=== [4/4] 옛 이미지 정리 ==="
            docker image prune -f

            echo "=== 배포 완료 ==="

      - name: 배포 결과 요약
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production 배포 성공"
            echo "Image SHA: ${{ needs.build-and-push.outputs.image-tag }}"
          else
            echo "❌ Production 배포 실패"
          fi