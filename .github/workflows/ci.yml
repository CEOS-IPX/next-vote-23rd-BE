# ============================================================
#  ci.yml — 검증 전용 파이프라인
# ============================================================

name: CI — 테스트 & 빌드 검증

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: 테스트 & 빌드 검증
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21 설정 + Gradle 캐시
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드 및 테스트 통합 실행
        run: ./gradlew build --no-daemon --parallel --build-cache