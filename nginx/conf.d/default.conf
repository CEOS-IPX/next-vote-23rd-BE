# ============================================================
# Nginx 리버스 프록시 설정
# ============================================================

# ============================================================
# HTTP → HTTPS 리다이렉트
# ============================================================
server {
    listen 80;
    server_name studying-developer.site www.studying-developer.site;

    # Certbot ACME 챌린지 (SSL 발급/갱신)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 메인 서버
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name studying-developer.site www.studying-developer.site;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/studying-developer.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studying-developer.site/privkey.pem;

    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 요청 본문 크기 제한
    client_max_body_size 10M;

    # 로그
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ============================================================
    # 헬스체크
    # ============================================================
    location /health {
        proxy_pass http://app-spring:8080/actuator/health;
        access_log off;
    }

    # ============================================================
    # 일반 API (인증, 회원, 프로젝트 등)
    # ============================================================
    location / {
        proxy_pass http://app-spring:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}